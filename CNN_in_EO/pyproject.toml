[project]
name = "cnn-projects"
version = "0.1.0"
description = "CNNs for Earth Observation — complete course materials"
requires-python = ">=3.12"
dependencies = [
    # Notebooks
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "jupyterlab>=4.1",
    "ipywidgets>=8.1",
    # Visualization
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # Deep learning
    "torch>=2.2",
    "torchvision>=0.17",
    # Segmentation
    "segmentation-models-pytorch>=0.3.3",
    "torchmetrics>=1.3",
    # EO / Geospatial
    "torchgeo>=0.6",
    "rasterio>=1.3",
    "rioxarray>=0.15",
    "xarray>=2024.1",
    "geopandas>=0.14",
    "pyproj>=3.6",
    "shapely>=2.0",
    # Augmentation
    "albumentations>=1.4",
    # Scientific stack
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.4",
    "scikit-image>=0.22",
    # Interpretability
    "grad-cam>=1.5",
    # Utilities
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "pillow>=10.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eo_cnn"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100